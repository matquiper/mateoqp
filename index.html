  for(var i=1;i<=10;i++)h+='<button type="button" data-act="crpe" data-v="'+bi+'.'+pi+'.'+i+'" aria-pressed="'+(cur===i)+'" aria-label="RPE '+i+', '+RPEW[i].toLowerCase()+'"'+(off?' disabled':'')+'>'+i+'</button>';
  return h+'<button type="button" class="clr" data-act="crpe" data-v="'+bi+'.'+pi+'.x" aria-label="Borrar el RPE"'+(off?' disabled':'')+'>×</button></div>';
}
/* jugadores del bloque sin RPE ni «No participó» (y que no estén ya guardados): si se guarda así, cuentan 0 */
/* «No participó» que se arrastra: quien ya tiene guardado «No participó» en otra tarea de esta sesión (y ningún RPE) sale como «No participó»
   en las demás tareas sin tocar nada. «Meter en la sesión» lo quita en toda la sesión; el botón «No participó» de cada tarea lo cambia solo en esa. */
function cHas(cs,p){return Object.prototype.hasOwnProperty.call(cs.abs,p);}
function cAuto(cs,p){return !cHas(cs,p)&&!!(st._dabs&&st._dabs[norm(p)]);}
function cAbs(cs,p){return cHas(cs,p)?!!cs.abs[p]:cAuto(cs,p);}

function eTier(d,rf,dir){

    '<li><span class="pill v">▲ relevante</span><span>de '+f2(rf.rel)+' a '+eU(rf.clr,rf)+'</span></li>'+

function pruebaList(){return uniq(Object.keys(PRUEBAS).concat(st.evals.map(function(r){return r.p;}).filter(Boolean)));}

function eGloss(){

    ['Cambios en el 30-15 IFT','Cambio mínimo: 0,3 km/h (0,2 × 1,3 km/h, la desviación típica media de la VIFT en cientos de equipos). Error típico del test: 0,5 km/h, una etapa. Cambio relevante a nivel individual: de 1 a 1,5 km/h (2 a 3 etapas), porque al cambio mínimo útil hay que sumarle el error del test. El panel lee cada cambio así: menos de 0,5, dentro del error; de 0,5 a 1, posible; de 1 a 1,5, relevante; desde 1,5, clara. En grupo, el cambio medio se compara con el cambio mínimo. Tras bloques de HIIT se describen mejoras medias de 1 a 1,5 km/h, sin más beneficio por encima de 2 a 4 semanas; la guía de la práctica propone repetir la prueba cada 6 a 8 semanas o tras un cambio de fase. «Etapa final» usa las mismas cifras en etapas (1 etapa = 0,5 km/h). Si escribes un CV de la prueba, manda el CV.'],

function kickerText(){
  if(st.view==='indiv')return 'Programas individuales · seguimiento';if(st.view==='puntos')return 'Puntos · adherencia y actitud';if(st.view==='partido')return 'Partido · sRPE por jugador';
  if(st.view==='hoy')return st.htab==='disp'?'Plantilla · quién puede entrenar y jugar':st.htab==='jugadores'?'Plantilla · altas y posiciones':'Plantilla · alertas de hoy';
  if(st.view==='cal')return st.ktab==='partidos'?'Calendario · partidos de la temporada':'Calendario · partidos y carga del mes';
  if(st.view==='bienestar'&&st.tab==='campo')return 'Bienestar · cuestionario antes de la sesión';
  if(st.view==='carga')return 'Carga · '+({resumen:'resumen del microciclo',monitor:'monitorización aguda y crónica',semana:'carga prevista frente a real',series:'sRPE por series',campo:'sesión en campo',registrar:st.mode==='plan'?'planificar una sesión':st.mode==='import'?'importar el microciclo del Excel':st.mode==='repeat'?'repetir una semana del plan':'registro de sesión',historial:'historial'}[st.ctab]);
  if(st.view==='eval')return 'Evaluaciones · '+({ranking:'resultados del grupo',jugador:'ficha del jugador',presc:'prescripción por grupos',nueva:'registrar una prueba'}[st.etab]);
  return 'Bienestar · '+({dia:'microciclo',jugador:'ficha del jugador',evolucion:'evolución'}[st.tab]);
}

  return html.replace(/^(<div class="titlerow">[\s\S]*?<\/div>(?:<p class="finding">[\s\S]*?<\/p>)?)/,'<section class="hero art'+(compact?' compact':'')+((st.view==='carga'&&(st.ctab==='campo'||st.ctab==='series'))?' fieldhero':'')+'"><p class="kicker"><i class="stk" aria-hidden="true"></i><span>'+esc(kickerText())+'</span></p>$1<div class="hero-art" aria-hidden="true">'+art+'</div></section>');

var NAV={stack:[],cur:null,skip:false}, NAVK=['view','team','ctab','tab','etab','htab','ktab','player','mode'];
function navSnap(){var o={};NAVK.forEach(function(k){o[k]=st[k];});return o;}
function navTrack(){var s=navSnap(),k=JSON.stringify(s);if(NAV.skip){NAV.skip=false;NAV.cur=k;}else{if(NAV.cur&&NAV.cur!==k){NAV.stack.push(NAV.cur);if(NAV.stack.length>40)NAV.stack.shift();}NAV.cur=k;}var b=document.getElementById('back');if(b)b.disabled=!NAV.stack.length;}
function navBack(){if(!NAV.stack.length)return;var prev=JSON.parse(NAV.stack.pop());NAVK.forEach(function(k){if(k in prev)st[k]=prev[k];});st.menu=false;NAV.skip=true;try{fixSelections();}catch(e){}render(true);window.scrollTo(0,0);}
document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-act="back"]');if(!b)return;e.stopImmediatePropagation();navBack();},true);
function guardForm(){return (st.view==='carga'&&(st.ctab==='registrar'||st.ctab==='campo'))||(st.view==='hoy'&&(st.htab==='disp'||st.htab==='jugadores'))||st.view==='cal'||(st.view==='bienestar'&&st.tab==='campo')||(st.view==='eval'&&(st.etab==='nueva'||st.etab==='presc'));}
function render(force,soft){
  draftSave();
  var app=document.getElementById('app');
  if(soft||(!force&&guardForm())){var ae=document.activeElement;if(ae&&/^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName)&&app.contains(ae))return;}
  navTrack();
  paintShell();
  var ready=st.status.k==='ok'||st.status.k==='warn';
  if(!ready){app.innerHTML=stateView();return;}
  var html, v=st.view;
  if(v==='carga'){
    if(st.cstat.k==='err'&&st.ctab!=='registrar'&&st.ctab!=='campo'){
      html='<div class="titlerow"><h1>Carga de entrenamiento</h1>'+chipTeam()+'</div><p class="finding">No se pudo leer la pestaña CARGA.</p>'+tabsHtml()+''+stateMsg('La pestaña CARGA no se pudo leer','Comprueba que tu hoja tiene una pestaña llamada CARGA con la fila de cabeceras y pulsa Reintentar.',true);
    } else {
      var D=cdata();
      html=st.ctab==='registrar'?cRegistrar(D):st.ctab==='historial'?cHistorial(D):st.ctab==='monitor'?cMonitor(D):st.ctab==='semana'?cSemana(D):st.ctab==='series'?cSeries(D):st.ctab==='campo'?cCampo(D):cResumen(D);
    }
    html+='<p class="foot">'+st.carga.length+' '+plural(st.carga.length,'registro','registros')+' de carga · pestaña CARGA de tu hoja.'+(st.cfull?' <b class="warnt">La pestaña CARGA tiene más de '+fi(CARGA_MAX)+' filas y el panel solo lee las primeras: archiva las filas antiguas en otra pestaña para ver las recientes.</b>':'')+'</p>';
  } else if(v==='partido'){html=cPartido()+'<p class="foot">Se guarda en la pestaña CARGA de tu hoja · partidos leídos de la pestaña PARTIDOS.</p>';
  } else if(v==='hoy'){html=st.htab==='disp'?cDisp():st.htab==='jugadores'?cJug():cHoy();} else if(v==='cal'){html=cCal();} else if(v==='eval'){
    html=st.etab==='jugador'?ePlayer():st.etab==='nueva'?eNueva():st.etab==='presc'?pxView():eRanking();
    html+='<p class="foot">'+st.evals.length+' '+plural(st.evals.length,'valor','valores')+' en la pestaña EVALUACIONES de tu hoja.</p>';
  } else if(v==='indiv'){html=ipView();
  } else if(v==='puntos'){html=ptsView();
  } else if(st.tab==='campo'){html=cWF();
  } else {
    if(!st.rows.length){app.innerHTML=stateMsg('La pestaña DATOS no tiene filas todavía','Comprueba que el formulario tiene respuestas de jugadores que están en la pestaña JUGADORES de tu hoja.',true);return;}
    html=(st.tab==='dia'?dayView():st.tab==='jugador'?playerView():evoView())+'<p class="foot">'+st.rows.length+' respuestas de '+uniq(st.rows.map(function(r){return r.j;})).length+' jugadores. Rojo: índice desde '+st.th.ir+' o 2 parámetros desde '+st.th.pr+'. Ámbar: índice desde '+st.th.ia+' o 1 parámetro desde '+st.th.pr+'. Umbrales leídos de la pestaña AJUSTES de tu hoja.</p>';
  }
  app.innerHTML=heroWrap(html)+mqSig();
  /* con seis pestañas la barra se desplaza: la elegida queda a la vista sin mover la página */
  var tb=app.querySelector('.tabs'), ts=tb&&tb.querySelector('.tab[aria-selected="true"]');
  if(tb&&ts&&tb.scrollWidth>tb.clientWidth)tb.scrollLeft=Math.max(0,ts.getBoundingClientRect().left-tb.getBoundingClientRect().left+tb.scrollLeft-(tb.clientWidth-ts.offsetWidth)/2);
  if(v==='bienestar'){if(st.tab!=='campo')draw();} else if(v!=='cal'&&v!=='partido'&&v!=='puntos'&&v!=='indiv')drawC();
}

/* ---------- eventos ---------- */
function rowAt(key){var p=key.split('.');return st.bk[st.f.tipo][+p[0]].rows[+p[1]];}
document.addEventListener('input',function(e){
  var t=e.target; if(!t.getAttribute)return;
  var ri=t.getAttribute('data-rp'); if(ri!=null){st.rp[st._ro[+ri]]=t.value;updPreview();return;}
  var c=t.getAttribute('data-c'); if(c){var p=c.split('.'); st.bk[st.f.tipo][+p[0]][p[1]]=t.value; updPreview(); return;}
  var b=t.getAttribute('data-b'); if(b){var q=b.split('.'); if(q[2]!=='fmt'){var rw=rowAt(b); rw[q[2]]=t.value; updPreview(); var ee=document.getElementById('eii-'+q[0]+'-'+q[1]); if(ee)ee.innerHTML=eiiText(rw);} return;}
  var cd=t.getAttribute('data-cd'); if(cd!=null){var bb=st._bobj&&st._bobj[+cd]; if(bb){cbState(bb).dur=t.value; draftSave();} return;}
  var evv=t.getAttribute('data-evv'); if(evv){var s=evv.split('.'), pl=st._ero[+s[0]], x=eFormVars()[+s[1]]; (st.ev.vals[pl]=st.ev.vals[pl]||{})[x.v]=t.value; var cell=document.getElementById('evx-'+s[0]); if(cell)cell.textContent=eDerived(pl); var en=document.getElementById('evn'); if(en){var n=eRowsToSave().length; en.textContent=n+' '+plural(n,'valor listo','valores listos')+' para guardar';} return;}
  var ek=t.getAttribute('data-ev'); if(ek==='fecha'||ek==='cv'){st.ev[ek]=t.value;return;}
  var k=t.getAttribute('data-f'); if(!k)return;
  st.f[k]=t.value; updPreview();

document.addEventListener('change',function(e){
  var t=e.target; if(!t.getAttribute)return;
  var k=t.getAttribute('data-f'), a=t.getAttribute('data-act'), b=t.getAttribute('data-b'), cpk=t.getAttribute('data-cp'), ek=t.getAttribute('data-ev');
  if(t.getAttribute('data-ind')){st.ind=t.checked;st.cmsg=null;render(true);return;}
  if(b){
    var p=b.split('.');
    if(p[2]==='fmt'){var rw=rowAt(b); rw.fmt=t.value; if(SSPMAP[t.value]!=null){rw.ex=t.value;rw.ne=String(SSPMAP[t.value]);} else if(t.value==='__otra'){rw.ne='';} render(true);}
    return;
  }
  if(cpk){st.cp[cpk]=t.value; if(cpk==='team'||cpk==='fecha')st.cp.ses=''; st.cmsg=null; render(true); return;}
  if(ek){
    if(ek==='prueba'){st.ev.prueba=t.value;st.ev.v='';st.ev.date='';st.ev.vals={};}
    else if(ek==='v')st.ev.v=t.value;
    else if(ek==='date')st.ev.date=+t.value;
    else if(ek==='player')st.ev.player=t.value;
    else if(ek==='team'){st.ev.team=t.value;st.ev.vals={};}
    else if(ek==='fecha')st.ev.fecha=t.value;
    else if(ek==='cv')st.ev.cv=t.value;
    st.emsg=null; render(true); return;
  }
  if(k==='team'){st.f.team=t.value;st.f.j='';st.rp={};st.ab={};st.f.after='';render(true);}
  else if(k==='fecha'||k==='ses'){st.f[k]=t.value;st.f.after='';if(k==='ses')st.f.sesNew=existSessions(st.f).indexOf(t.value)<0;render(true);}
  else if(k==='tipo'){st.f.tipo=t.value;st.cmsg=null;render(true);}
  else if(a==='cwk'){st.cwk=+t.value;render();}
  else if(a==='md'){var d=cdate(t.value); if(d!=null){st.md=d;render();}}
  else if(a==='mp'){st.mp=t.value;render();}
});
function setRpe(map,p,n){if(n==='x'||num(map[p])===+n)delete map[p]; else map[p]=+n;}
document.addEventListener('click',function(e){
  var bt=e.target.closest('[data-act]'); if(!bt||bt.tagName==='SELECT'||bt.tagName==='INPUT')return; var a=bt.getAttribute('data-act'), v=bt.getAttribute('data-v');

  else if(a==='wmode'){st.wmode=v;render();}
  else if(a==='cm'){st.cm=v;render();}

    try{navigator.clipboard.writeText(txt).then(ok,ko);}catch(err){ko();}
  }
  else if(a==='rmode'){
    if(st.draft.length&&v!==st.mode){st.cmsg={k:'err',t:'Guarda o vacía la sesión en preparación antes de cambiar entre registrar y planificar.'};}
    else{st.mode=v;st.cmsg=null;}
    render(true);
  }
  else if(a==='rplan'){st.ctab='registrar';st.mode='plan';st.cmsg=null;render(true);window.scrollTo(0,0);}

  else if(a==='cadd'){st.bk[st.f.tipo].push(newCirc(st.f.tipo));render(true);}

  else if(a==='cdel'){var c2=st.bk[st.f.tipo]; if(c2.length>1){c2.splice(+v,1);render(true);}}
  else if(a==='radd'){st.bk[st.f.tipo][+v].rows.push(newRow(st.f.tipo));render(true);}

/* ================= IDEAS DE OPENATHLETE: forma, semana prevista frente a real y panel de alertas ================= */
/* OpenAthlete (AGPL-3.0) es una plataforma de entrenamiento de resistencia. De ahí salen tres ideas, escritas aquí desde cero con fórmulas públicas
   (no se ha copiado código):
   1) Forma: fitness (CTL, 42 días), fatiga (ATL, 7 días) y forma (TSB = CTL − ATL) con el modelo de impulso-respuesta de Banister (1975),
      cuyo peso diario es 1 − e^(−1/τ) (no 2/(N+1), que es otro modelo; Clarke y Skiba, 2013).
   2) Semana: la carga de las sesiones planificadas (minutos del plan × RPE esperado) frente a la real, con la proyección del ACWR y de la forma.
   3) Hoy: un panel del entrenador que pone primero a quien necesita atención (dolor, bienestar en rojo, ACWR fuera de zona, sin cuestionario, sin carga). */
var OA_TA=7, OA_TC=42, OA_AA=1-Math.exp(-1/OA_TA), OA_AC=1-Math.exp(-1/OA_TC);
var OA_DEF0={'Resistencia':8,'Técnico-táctico':6,'Partido':7,'Fuerza':6,'Velocidad':6,'Recuperación':2,'Otro':3};
st.oaw=null; st.oadef=null;
if(typeof ICON==='object')ICON.hoy='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4"/><path d="M9 15l2 2 4-4"/></svg>';

function oaToday(){var d=new Date();return Date.UTC(d.getFullYear(),d.getMonth(),d.getDate());}
function oaKeep(){var y=window.scrollY; render(true); window.scrollTo(0,y);}
function oaDefs(){
  if(st.oadef)return st.oadef;
  var d=Object.assign({},OA_DEF0);
  try{var s=JSON.parse(localStorage.getItem('mqp.rpeDef')||'null'); if(s)Object.keys(d).forEach(function(k){if(typeof s[k]==='number'&&s[k]>=0&&s[k]<=10)d[k]=s[k];});}catch(e){}
  return st.oadef=d;
}
function oaSaveDefs(){try{localStorage.setItem('mqp.rpeDef',JSON.stringify(st.oadef));}catch(e){}}

/* fitness, fatiga y forma día a día; se parte de 0, así que los primeros 42 días son provisionales */
function faSeries(arr){
  var c=0,a=0;
  return arr.map(function(v){c=OA_AC*v+(1-OA_AC)*c; a=OA_AA*v+(1-OA_AA)*a; return {ctl:c,atl:a,tsb:c-a};});
}

/* ---------- carga prevista: minutos del plan × RPE esperado de cada tarea ---------- */
/* RPE esperado = media ponderada por minutos de lo registrado en esa tarea (mismo nombre) por ese equipo; con menos de 10 min de historial, el RPE por defecto de su tipo */
function oaHist(team){
  var m={};
  st.carga.forEach(function(r){
    if(!r.rpeOnly||r.abs||r.fin||r.cfin||r.rpe==null||!(r.dur>0)||twide(r.j)||(r.team&&r.team!==team))return;
    var k=norm(r.bloque); if(!k)return;
    var o=m[k]=m[k]||{ua:0,min:0}; o.ua+=r.rpe*r.dur; o.min+=r.dur;
  });
  return m;
}
function oaRpe(row,hist,defs){
  var h=hist[norm(row.bloque)];
  if(h&&h.min>=10)return {v:h.ua/h.min,src:'historial'};
  return {v:defs[row.tipo]!=null?defs[row.tipo]:6,src:'por defecto'};
}
function oaPlanDay(t,team,hist,defs){
  var o={min:0,ua:0,tasks:[]};
  planFor(t,team).forEach(function(r){
    var m=planCalc(r).dur; if(!(m>0))return;
    var e=oaRpe(r,hist,defs); o.min+=m; o.ua+=m*e.v; o.tasks.push({name:r.bloque||r.ex||r.tipo,min:m,rpe:e.v,src:e.src});
  });
  return o;
}
function oaWeeks(team){
  var s={};
  st.plan.forEach(function(r){if(r.team===team)s[weekStart(r.t,st.start)]=1;});
  st.carga.forEach(function(r){if(r.team===team&&r.rpeOnly&&!r.abs&&r.wk!=null)s[r.wk]=1;});
  return Object.keys(s).map(Number).sort(function(a,b){return b-a;});
}
/* la semana en la que se está trabajando: la primera con algún día de plan de hoy en adelante; si no hay, la actual o la última con datos */
function oaDefaultWeek(ws,team){
  var today=oaToday(), cur=weekStart(today,st.start), nxt=null;
  st.plan.forEach(function(r){if(r.team===team&&r.t>=today){var w=weekStart(r.t,st.start); if(nxt==null||w<nxt)nxt=w;}});
  if(nxt!=null)return nxt;
  if(ws.indexOf(cur)>=0)return cur;
  return ws.length?ws[0]:cur;
}
/* todo lo de una semana: previsto y real por día, serie con proyección (los días de hoy en adelante sin dato cuentan lo previsto), ACWR y forma */
function oaBuild(D,team,w,player){
  var A=st.team==='TODOS'?D.A.filter(function(a){return a.t===team;}):D.A, M=monData({A:A}), today=oaToday(), endW=w+6*DAY, hist=oaHist(team), defs=oaDefs();
  var base=M?arrFor(M,player):[], start=M?Math.min(M.first,w):w;
  var real=function(t){if(!M)return 0; var k=Math.round((t-M.first)/DAY); return (k>=0&&k<M.n)?base[k]:0;};
  var mins={}; A.forEach(function(a){var r=a.r; if(!r.rpeOnly||r.abs||r.fin||r.cfin||!(r.dur>0)||(player&&a.p!==player))return; var o=mins[r.t]=mins[r.t]||{}; o[a.p]=(o[a.p]||0)+r.dur;});
  var minOf=function(t){var o=mins[t]; if(!o)return 0; var v=Object.keys(o).map(function(p){return o[p];}); return v.reduce(function(s,x){return s+x;},0)/v.length;};
  var arr=[], proj=[], t, k, days=[];
  for(t=start;t<=endW;t+=DAY){
    var r=real(t), pl=oaPlanDay(t,team,hist,defs), isP=!(r>0)&&t>=today&&pl.ua>0;
    arr.push(isP?pl.ua:r); proj.push(isP);
  }
  var S=acSeries(arr,'roll'), F=faSeries(arr), planTot=0, realTot=0, pMin=0, rMin=0, eMin=0, eReal=0;
  for(k=0;k<7;k++){
    t=w+k*DAY; var rr=real(t), pp=oaPlanDay(t,team,hist,defs), mr=minOf(t), idx=Math.round((t-start)/DAY);
    var st1=rr>0?'hecho':(pp.ua>0?(t>=today?'pendiente':'sin registrar'):'');
    days.push({t:t,plan:pp,real:rr,minR:mr,state:st1,idx:idx});
    planTot+=pp.ua; realTot+=rr; pMin+=pp.min; rMin+=mr;
    if(pp.min>0&&(t<today||rr>0)){eMin+=pp.min; eReal+=mr;}
  }
  var last=arr.length-1, ps=0, ok=(w-21*DAY)>=start;
  if(ok){var i0=Math.round((w-21*DAY-start)/DAY), j; for(j=i0;j<i0+21;j++)ps+=arr[j]||0;}
  var projTot=0; days.forEach(function(d){projTot+=arr[d.idx]||0;});
  return {M:M,arr:arr,proj:proj,start:start,days:days,S:S,F:F,planTot:planTot,realTot:realTot,projTot:projTot,pMin:pMin,rMin:rMin,comp:eMin>0?eReal/eMin*100:null,
    acwr:S[last]?S[last].acwr:null,hist:S[last]?S[last].hist:0,tsb:F[last]?F[last].tsb:null,ctl:F[last]?F[last].ctl:null,atl:F[last]?F[last].atl:null,
    range:(ok&&ps>0)?{lo:0.25*ps,hi:1.3*ps/2.7}:null,today:today,w:w,nProj:proj.filter(Boolean).length};
}

function mtParse(text,team,comp,jor){
  var out=[], skipped=0, key=team===TEAMS[0]?/esf[eé]rico/i:/bah[ií]a/i, have={};
  st.mt.forEach(function(m){have[m.team+'|'+m.t]=1;});
  String(text||'').split(/\r?\n/).forEach(function(line){
    line=line.trim(); if(!line)return;
    var d=line.match(/(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/); if(!d){skipped++;return;}
    var y=+d[3]; if(y<100)y+=2000; var t=Date.UTC(y,+d[2]-1,+d[1]), tm=line.replace(d[0],' ').match(/(\d{1,2}):(\d{2})/);
    var rest=line.replace(d[0],' ').replace(/(\d{1,2}):(\d{2})/,' ').replace(/\s+/g,' ').trim(), pr=rest.split(/\s+(?:-|–|—|vs\.?|v)\s+|\s*\|\s*|\t+/).map(function(x){return x.trim();}).filter(Boolean);
    if(pr.length<2){skipped++;return;}
    var a=pr[0], b=pr[1], home;
    if(key.test(a))home=true; else if(key.test(b))home=false; else {skipped++;return;}
    if(have[team+'|'+t]){skipped++;return;}
    out.push({t:t,hora:tm?p2(+tm[1])+':'+tm[2]:'',team:team,rival:home?b:a,lugar:home?'Casa':'Fuera',comp:comp,jor:jor,campo:'',res:'',est:'Pendiente'});
  });
  out.skipped=skipped; return out;
}

/* ================= BORRADOR DE RPE EN ESTE DISPOSITIVO Y «SALTAR AL CONTENIDO» ================= */
/* En campo el iPad puede recargar la página (cambio de aplicación, poca memoria) y se perderían los RPE que aún no se han guardado.
   El borrador (st.cb: RPE, «No participó» y duración de cada serie o bloque, y el número de series de cada tarea, st.cn) se guarda en el navegador
   de este dispositivo y se recupera al abrir el panel. Solo se conserva lo de los últimos 10 días. Es una comodidad de este dispositivo: no llega a la hoja
   ni a otros dispositivos, y se vacía solo al guardar. Todas las lecturas y escrituras van en try/catch porque el navegador puede negar el almacenamiento. */
var DRAFT_KEY='mqp.draft.v1', DRAFT_LAST='';
function draftDay(k){var m=String(k).match(/^(\d{4})-(\d{2})-(\d{2})\|/); return m?Date.UTC(+m[1],+m[2]-1,+m[3]):null;}
function draftData(){
  var cb={}, cn={};
  Object.keys(st.cb).forEach(function(k){
    var s=st.cb[k]; if(!s)return;
    if(Object.keys(s.rpe||{}).length||Object.keys(s.abs||{}).length||String(s.dur==null?'':s.dur).trim()!=='')cb[k]={rpe:s.rpe||{},abs:s.abs||{},dur:s.dur==null?'':s.dur};
  });
  Object.keys(st.cn).forEach(function(k){if(st.cn[k]>0)cn[k]=st.cn[k];});
  return {cb:cb,cn:cn};
}
function draftSave(){
  try{var s=JSON.stringify(draftData()); if(s===DRAFT_LAST)return; DRAFT_LAST=s; localStorage.setItem(DRAFT_KEY,s);}catch(e){}
}
function draftLoad(){
  try{
    var o=JSON.parse(localStorage.getItem(DRAFT_KEY)||'null'); if(!o)return 0;
    var cut=Date.now()-10*86400000, n=0;
    Object.keys(o.cb||{}).forEach(function(k){
      var d=draftDay(k), s=o.cb[k]; if(d==null||d<cut||st.cb[k]||!s)return;
      st.cb[k]={rpe:s.rpe||{},abs:s.abs||{},dur:s.dur||''}; n++;
    });
    Object.keys(o.cn||{}).forEach(function(k){var d=draftDay(k); if(d!=null&&d>=cut&&st.cn[k]==null)st.cn[k]=o.cn[k];});
    DRAFT_LAST=JSON.stringify(draftData());
    return n;
  }catch(e){return 0;}
}
st.draftN=draftLoad();

  if(warn&&hi)return {k:'a',t:'Mantén, no subas',d:'Bienestar algo bajo y carga alta: conserva la dosis y revisa en 2-3 días.'};
  if(warn)return {k:'a',t:'Vigila el bienestar',d:'Algo por debajo de su normalidad (Z entre −1 y −1,5): pregúntale cómo está y revisa en 2-3 días.'};
  if(lo)return {k:'v',t:'Puede tolerar más (+5-10 %)',d:'Bienestar normal y carga reciente por debajo de su habitual.'};
  return {k:'v',t:'Continúa con el plan',d:'Carga y bienestar dentro de su normalidad.'};
}

/* ---------- gráficos ---------- */
function ipChart(o){
  var w=720,h=o.h||220,m={l:40,r:12,t:12,b:24},iw=w-m.l-m.r,ih=h-m.t-m.b,n=o.days.length;
  var X=function(i){return m.l+(n<=1?iw/2:i/(n-1)*iw);},bw=Math.max(2,iw/n*0.7),Y=function(v){return m.t+ih-(v-o.y0)/(o.y1-o.y0)*ih;};
  var s='<svg class="ipc" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+esc(o.label)+'">';
  (o.bands||[]).forEach(function(b){var a=Math.max(b.from,o.y0),c=Math.min(b.to,o.y1);if(c<=a)return;s+='<rect x="'+m.l+'" y="'+Y(c).toFixed(1)+'" width="'+iw+'" height="'+(Y(a)-Y(c)).toFixed(1)+'" style="fill:'+b.c+'"/>';});
  (o.yt||[]).forEach(function(v){var y=Y(v).toFixed(1);s+='<line x1="'+m.l+'" x2="'+(w-m.r)+'" y1="'+y+'" y2="'+y+'" style="stroke:var(--track);stroke-width:1"/><text x="'+(m.l-6)+'" y="'+(+y+4)+'" text-anchor="end" style="font-size:12px;fill:var(--muted)">'+(o.yf?o.yf(v):v)+'</text>';});
  (o.refs||[]).forEach(function(r){var y=Y(r.v).toFixed(1);s+='<line x1="'+m.l+'" x2="'+(w-m.r)+'" y1="'+y+'" y2="'+y+'" style="stroke:'+(r.c||'var(--ink)')+';stroke-width:1.5;stroke-dasharray:5 4"/>'+(r.l?'<text x="'+(w-m.r-4)+'" y="'+(+y-5)+'" text-anchor="end" style="font-size:11px;fill:var(--muted)">'+esc(r.l)+'</text>':'');});
  (o.bars||[]).forEach(function(b){b.v.forEach(function(v,i){var base=b.base?b.base[i]:0;if(!v)return;s+='<rect x="'+(X(i)-bw/2).toFixed(1)+'" y="'+Y(base+v).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(0,Y(base)-Y(base+v)).toFixed(1)+'" style="fill:'+b.c+'"><title>'+fd(o.days[i])+': '+fi(v)+' UA '+esc(b.n)+'</title></rect>';});});
  (o.lines||[]).forEach(function(L){var seg=[],out=[];L.v.forEach(function(v,i){if(v==null){if(seg.length)out.push(seg);seg=[];return;}seg.push(X(i).toFixed(1)+','+Y(Math.max(o.y0,Math.min(o.y1,v))).toFixed(1));});if(seg.length)out.push(seg);
    out.forEach(function(sg){if(sg.length>1)s+='<polyline points="'+sg.join(' ')+'" style="fill:none;stroke:'+L.c+';stroke-width:'+(L.w||2.5)+(L.dash?';stroke-dasharray:'+L.dash:'')+'"/>';});
    if(L.dots)L.v.forEach(function(v,i){if(v==null)return;var al=L.alert&&L.alert(v);s+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(Math.max(o.y0,Math.min(o.y1,v))).toFixed(1)+'" r="'+(al?5.5:3.5)+'" style="fill:'+(al?'var(--acc)':L.c)+';stroke:var(--sheet);stroke-width:1.5"><title>'+fd(o.days[i])+': '+f1(v)+(al?' · alerta':'')+'</title></circle>';});});
  var step=Math.max(1,Math.round(n/6));for(var i=0;i<n;i+=step)s+='<text x="'+X(i).toFixed(1)+'" y="'+(h-6)+'" text-anchor="middle" style="font-size:12px;fill:var(--muted)">'+fs(o.days[i])+'</text>';
  return s+'</svg>';
}
function ipSpark(S){var v=S.map(function(s){return s.e1;}).filter(function(x){return x!=null;});if(v.length<2)return '';var w=110,h=30,a=Math.min.apply(null,v),b=Math.max.apply(null,v);if(a===b){a-=1;b+=1;}
  var pts=v.map(function(x,i){return (4+i/(v.length-1)*(w-8)).toFixed(1)+','+(h-4-(x-a)/(b-a)*(h-8)).toFixed(1);});
  return '<svg viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'" aria-hidden="true"><polyline points="'+pts.join(' ')+'" style="fill:none;stroke:var(--acc);stroke-width:2"/><circle cx="'+pts[pts.length-1].split(',')[0]+'" cy="'+pts[pts.length-1].split(',')[1]+'" r="3" style="fill:var(--acc)"/></svg>';}
function ipNice(mx){if(!(mx>0))return {y1:100,yt:[0,50,100]};var p=Math.pow(10,Math.floor(Math.log10(mx))),st2=[1,2,2.5,5,10].map(function(k){return k*p;}).filter(function(k){return mx/k<=5;})[0]||p*10,y1=Math.ceil(mx/st2)*st2,t=[];for(var v=0;v<=y1+1e-9;v+=st2)t.push(Math.round(v));return {y1:y1,yt:t};}

/* ---------- vista ---------- */
function ipView(){

  var h='<style>.ipc{width:100%;height:auto;display:block;margin:4px 0}.iptab td{vertical-align:middle}</style><div class="titlerow"><h1>Programas individuales</h1></div><p class="finding">Seguimiento de quien tiene programa propio: cumplimiento, carga total (equipo + individual), bienestar respecto a su propia normalidad y evolución de la fuerza. Los datos salen de la hoja «Programas individuales» y de CARGA.</p>';
  if(!J.length)return h+'<p class="empty">No hay jugadores con programa individual. Añádelos en la pestaña JUGADORES de la hoja «Programas individuales».</p>';
  if(!V.sel||!J.some(function(j){return j.j===V.sel;}))V.sel=J[0].j;

    rows.map(function(r){var today=oaToday(),dd=r.ld!=null?Math.round((today-r.ld)/DAY):null,z=r.W.z7;
      return '<tr data-ip="sel" data-v="'+esc(r.j.j)+'" style="cursor:pointer'+(r.j.j===V.sel?';background:var(--acc-soft)':'')+'"><td class="t"><b>'+esc(title(r.j.j))+'</b><br><span class="mut">'+esc(r.j.team)+(r.j.lib?' · elige él':'')+'</span></td><td class="t mut" style="max-width:220px">'+esc(r.j.prog)+'</td>'+
        '<td>'+(r.A.pct!=null?'<span class="cell '+(r.A.pct>=80?'v':r.A.pct>=50?'a':'r')+'">'+r.A.pct+' %</span><br><span class="mut">'+r.A.n+' hechas · '+r.A.exp+' previstas</span>':'<b>'+r.A.n+'</b> <span class="mut">sesiones</span>')+'</td>'+
        '<td>'+(r.ld!=null?fs(r.ld)+'<br><span class="mut">hace '+dd+' d</span>':'<span class="mut">ninguna</span>')+'</td><td>'+fi(r.K.sum)+' <span class="mut">UA</span></td><td>'+(r.K.acwr!=null?'<span class="cell '+(r.K.acwr>1.5?'r':r.K.acwr>1.3||r.K.acwr<0.8?'a':'v')+'">'+f1(r.K.acwr)+'</span>':'–')+'</td>'+
        '<td>'+(z!=null?'<span class="cell '+(z<=-1.5?'r':z<=-1?'a':'v')+'">'+(z>0?'+':'')+f1(z)+'</span>':'–')+'</td><td class="t"><span class="pill '+(r.D.k||'n')+'">'+esc(r.D.t)+'</span></td></tr>';}).join('')+'</tbody></table></div></section>';
  /* 2. detalle del jugador */
  var j=J.filter(function(x){return x.j===V.sel;})[0],per=V.per,S=ipSeries(j.j),N=S.days.length,days=S.days.slice(N-per),tot=S.tot.slice(N-per),ind=S.ind.slice(N-per),K=ipWeek(S),W=ipWell(j.j,days),A=ipAdh(j,28),D=ipDecide(W,K);
  var oth=tot.map(function(v,i){return Math.max(0,v-ind[i]);}),r7=ipRoll(S.tot,7).slice(N-per),SS=ipSessions(j.j),last=SS[0];
  h+='<section class="block" style="margin-top:28px"><div class="sect"><h2>'+esc(title(j.j))+'</h2><div class="seg">'+[[28,'4 semanas'],[56,'8 semanas']].map(function(x){return '<button data-ip="per" data-v="'+x[0]+'" aria-pressed="'+(per===x[0])+'">'+x[1]+'</button>';}).join('')+'</div></div>'+
    '<p class="mut" style="margin:-4px 0 12px">'+esc(j.prog)+(j.gr?' · entrena con el equipo: '+esc(j.gr):'')+(j.lib?' · elige él la sesión':'')+'</p>';
  var dW=K.psum>0?Math.round((K.sum/K.psum-1)*100):null,dRPE=last&&last.real!=null&&last.obj!=null?last.real-last.obj:null;
  h+='<div class="kpis k4">'+
    kpi('Cumplimiento',A.pct!=null?A.pct+' %':String(A.n),A.pct!=null?(A.pct>=80?'':A.pct>=50?'a':'r'):'',A.exp?A.n+' hechas · '+A.exp+' previstas en 4 semanas':'sesiones en 4 semanas (elige él)')+
    kpi('Carga 7 días',fi(K.sum)+' UA','',dW!=null?(dW>0?'+':'')+dW+' % frente a la semana anterior':'equipo + partidos + individual')+
    kpi('ACWR (EWMA)',K.acwr!=null?f1(K.acwr):'–',K.acwr!=null?(K.acwr>1.5?'r':K.acwr>1.3||K.acwr<0.8?'a':''):'','aguda 7 d / crónica 28 d · ideal 0,8–1,3')+
    kpi('Bienestar Z',W.z7!=null?(W.z7>0?'+':'')+f1(W.z7):'–',W.z7!=null?(W.z7<=-1.5?'r':W.z7<=-1?'a':''):'',W.z7!=null?'últimos 7 d frente a sus 28 d · '+W.alerts+' '+plural(W.alerts,'alerta','alertas'):'faltan respuestas de wellness')+
    kpi('Monotonía',K.mono!=null?f1(K.mono):'–',K.mono!=null&&K.mono>2?'a':'','strain '+(K.strain!=null?fi(K.strain):'–')+' · media/SD de los 7 días')+
    kpi('RPE real vs objetivo',dRPE!=null?(dRPE>0?'+':'')+f1(dRPE):'–',dRPE!=null&&Math.abs(dRPE)>=1?'a':'',last?'última sesión: '+f1(last.real)+' frente a '+f1(last.obj):'sin sesiones registradas')+'</div>';
  h+='<div class="note '+(D.k==='r'?'warnt':'')+'" style="margin:14px 0;padding:14px 16px;border-radius:14px;background:'+(D.k==='r'?'var(--red-bg)':D.k==='a'?'var(--amb-bg)':D.k==='v'?'var(--ok-bg)':'var(--track)')+'"><b style="font-size:17px">'+esc(D.t)+'</b><br>'+esc(D.d)+'</div>';
  /* gráfico 1: carga y media móvil */
  var mx=Math.max.apply(null,tot.concat(r7.filter(function(v){return v!=null;})).concat([1])),sc=ipNice(mx);
  h+='<div class="sect" style="margin-top:8px"><h2 style="font-size:16px">Carga diaria y media móvil de 7 días</h2><span><i style="display:inline-block;width:10px;height:10px;background:var(--acc);border-radius:2px"></i> individual · <i style="display:inline-block;width:10px;height:10px;background:var(--field-edge);border-radius:2px"></i> equipo y partidos · línea: media 7 d</span></div>'+
    ipChart({days:days,y0:0,y1:sc.y1,yt:sc.yt,label:'Carga diaria de '+title(j.j),bars:[{v:oth,c:'var(--field-edge)',n:'equipo'},{v:ind,base:oth,c:'var(--acc)',n:'individual'}],lines:[{v:r7,c:'var(--ink)',w:2.5}]});
  /* gráfico 2: bienestar Z */
  var zr=ipRoll(W.z,7);
  h+='<div class="sect" style="margin-top:18px"><h2 style="font-size:16px">Bienestar respecto a su normalidad (z-score)</h2><span>0 = su media de 28 días · por debajo de −1,5 = alerta · línea: media 7 d</span></div>'+
    (W.z.some(function(v){return v!=null;})?ipChart({days:days,y0:-3,y1:3,yt:[-3,-2,-1,0,1,2,3],yf:function(v){return v>0?'+'+v:v;},h:200,label:'Bienestar z de '+title(j.j),bands:[{from:-3,to:-1.5,c:'var(--red-bg)'},{from:-1.5,to:-1,c:'var(--amb-bg)'}],refs:[{v:0,c:'var(--field-edge)'}],lines:[{v:W.z,c:'var(--field-edge)',w:1.5,dots:true,alert:function(v){return v<=-1.5;}},{v:zr,c:'var(--ink)',w:2.5}]}):'<p class="empty">Aún no hay suficientes respuestas de wellness (hacen falta 5 en 28 días).</p>');
  /* fuerza */
  var E=ipExercises(j.j);
  h+='<div class="sect" style="margin-top:22px"><h2 style="font-size:16px">Fuerza: evolución por ejercicio</h2><span>e1RM con RIR (Epley) · cambio relevante ≥ '+IP_SESOI+' %</span></div>'+
    (E.length?'<div class="scroll"><table><thead><tr><th class="t">Ejercicio</th><th>Sesiones</th><th>Primera</th><th>Última</th><th>Cambio</th><th class="t">Valoración</th><th>Evolución</th><th class="t">Carga interna:externa</th></tr></thead><tbody>'+
      E.map(function(e){var l=e.S[e.S.length-1];return '<tr><td class="t">'+esc(e.x)+'</td><td>'+e.S.length+'</td><td>'+(e.first?fi(e.first.e1)+' kg':'–')+'</td><td>'+(e.last?fi(e.last.e1)+' kg':(l&&l.reps?l.reps+' reps':'–'))+'</td><td>'+(e.pct!=null?(e.pct>0?'+':'')+f1(e.pct)+' %':'–')+'</td>'+
        '<td class="t"><span class="cell '+e.cls.k+'">'+e.cls.s+' '+esc(e.cls.t)+'</span></td><td>'+ipSpark(e.S)+'</td><td class="t">'+(e.ef||'<span class="mut">–</span>')+'</td></tr>';}).join('')+'</tbody></table></div>':'<p class="empty">Aún no hay series registradas.</p>');
  /* sesiones */
  h+='<div class="sect" style="margin-top:22px"><h2 style="font-size:16px">Sesiones registradas</h2><span>series hechas frente a las programadas</span></div>'+
    (SS.length?'<div class="scroll"><table><thead><tr><th>Fecha</th><th class="t">Sesión</th><th>Series</th><th>RPE series</th><th>Objetivo</th><th>RPE sesión</th><th>Min</th><th>sRPE</th><th>Wellness</th></tr></thead><tbody>'+
      SS.slice(0,20).map(function(s){var c=s.pres?Math.round(s.done/s.pres*100):null;return '<tr><td>'+wd(s.t)+' '+fs(s.t)+'</td><td class="t">'+esc(s.s)+'</td><td>'+s.done+(s.pres?' / '+s.pres+' <span class="cell '+(c>=90?'v':c>=60?'a':'r')+'">'+c+' %</span>':'')+'</td><td>'+f1(s.real)+'</td><td class="mut">'+f1(s.obj)+'</td><td>'+f1(s.rpe)+'</td><td>'+fi(s.min)+'</td><td>'+fi(s.ua)+'</td><td>'+(s.w!=null?icell(s.w):'–')+'</td></tr>';}).join('')+'</tbody></table></div>':'<p class="empty">Aún no hay sesiones registradas.</p>');
  h+='<details class="glos"><summary>Cómo se calcula cada cosa</summary><dl>'+

    '<dt>ACWR (EWMA)</dt><dd>Carga aguda / crónica con medias exponenciales: λ = 2/(N+1), 7 días la aguda y 28 la crónica. Da más peso a lo reciente. Zona habitual 0,8–1,3.</dd>'+
    '<dt>Monotonía y strain</dt><dd>Monotonía = media / SD de la carga de los 7 días. Por encima de 2, cargas muy repetitivas. Strain = carga semanal × monotonía.</dd>'+
    '<dt>Bienestar Z</dt><dd>Z = (valor − su media de 28 días) / su SD, con el signo cambiado para que negativo sea peor. Alerta si Z ≤ −1,5. El KPI compara la media de los últimos 7 días con sus 28 días.</dd>'+
    '<dt>e1RM y cambio relevante</dt><dd>1RM estimado = kg × (1 + (reps + RIR) / 30); si no hay RIR se usa 10 − RPE. Se compara la primera sesión con la última: por debajo del '+IP_SESOI+' % no se considera un cambio relevante.</dd>'+
    '<dt>Carga interna:externa</dt><dd>Si la misma carga (o más) le cuesta menos RPE que la vez anterior, es señal de adaptación. Si le cuesta más con igual o menos carga, mira la fatiga.</dd>'+
    '<dt>Qué hacer</dt><dd>Esquema de Gabbett (2017): cruza la carga reciente (ACWR) con el bienestar Z. Es una ayuda, no sustituye tu criterio.</dd></dl></details>';
  return h;
